<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenScan: Fast PDF Scanner</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jsPDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Google Mobile Ads / AdMob SDK Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js" crossorigin="anonymous"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- App Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex items-center justify-between">
        <div>
            <h1 class="text-xl font-bold tracking-wide">ZenScan 📄</h1>
            <p class="text-xs text-blue-100">100% Offline • Zero Watermarks</p>
        </div>
        <a href="https://www.buymeacoffee.com/kromdev" target="_blank" rel="noopener noreferrer" class="bg-amber-400 hover:bg-amber-500 text-slate-900 text-xs font-bold py-2 px-3 rounded-lg shadow flex items-center gap-1 transition">
            <span>☕ Donate</span>
        </a>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 flex flex-col gap-4">
        <div class="grid grid-cols-2 gap-3">
            <label class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl shadow cursor-pointer text-center flex items-center justify-center gap-2 transition">
                <span>📷 Capture Page</span>
                <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
            </label>

            <button id="generatePdfBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-xl shadow flex items-center justify-center gap-2 transition disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                <span>💾 Save PDF (<span id="pageCount">0</span>)</span>
            </button>
        </div>

        <div class="flex-1 bg-white border-2 border-dashed border-slate-200 rounded-2xl p-4 flex flex-col min-h-[250px]">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400">Scanned Queue</h2>
                <button id="clearAllBtn" class="text-xs text-rose-500 hover:underline hidden">Clear All</button>
            </div>

            <div id="emptyState" class="my-auto text-center text-slate-400 py-10">
                <p class="text-4xl mb-2">📥</p>
                <p class="text-sm">No pages captured yet.<br>Tap "Capture Page" to start scanning.</p>
            </div>

            <div id="thumbnailContainer" class="grid grid-cols-2 gap-3 overflow-y-auto max-h-[40vh] pr-1"></div>
        </div>
    </main>

    <!-- AdMob Banner Box -->
    <div class="w-full bg-slate-200 border-t border-slate-300 py-2 flex flex-col items-center justify-center min-h-[60px]">
        <p class="text-[10px] text-slate-400 uppercase tracking-widest mb-1">Advertisement</p>
        
        <!-- Antikatastise to data-ad-client kai data-ad-slot me τα dika sou apo to AdMob -->
        <ins class="adsbygoogle"
             style="display:block; width:100%; max-width:320px; height:50px;"
             data-ad-client="ca-app-pub-2603099615534110~5242761308"
             data-ad-slot="5242761308"
             data-ad-format="horizontal"
             data-full-width-responsive="false"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
        
    </div>
    
    <footer class="text-center py-2 bg-slate-100 border-t border-slate-200">
    <a href="privacy.html" class="text-[11px] text-slate-500 hover:underline">Privacy Policy</a>
</footer>
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex-col items-center justify-center text-white z-50">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-white border-t-transparent mb-3"></div>
        <p id="loadingText" class="font-medium text-sm">Processing image filter...</p>
    </div>

    <!-- App Logic Script -->
    <script>
        const cameraInput = document.getElementById('cameraInput');
        const thumbnailContainer = document.getElementById('thumbnailContainer');
        const emptyState = document.getElementById('emptyState');
        const generatePdfBtn = document.getElementById('generatePdfBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const pageCountSpan = document.getElementById('pageCount');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');

        let scannedPages = [];

        cameraInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            loadingText.innerText = "Applying document enhancement...";
            loadingOverlay.classList.remove('hidden');

            try {
                const processedDataUrl = await processDocumentImage(file);
                scannedPages.push(processedDataUrl);
                updateUI();
            } catch (err) {
                alert("Error processing image. Please try again.");
                console.error(err);
            } finally {
                loadingOverlay.classList.add('hidden');
                cameraInput.value = '';
            }
        });

        function processDocumentImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');

                        const MAX_DIM = 1200;
                        let width = img.width;
                        let height = img.height;
                        if (width > height && width > MAX_DIM) {
                            height *= MAX_DIM / width;
                            width = MAX_DIM;
                        } else if (height > MAX_DIM) {
                            width *= MAX_DIM / height;
                            height = MAX_DIM;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);

                        const imgData = ctx.getImageData(0, 0, width, height);
                        const data = imgData.data;
                        
                        for (let i = 0; i < data.length; i += 4) {
                            let avg = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
                            let threshold = 160;
                            let v = avg > threshold ? 255 : (avg < 60 ? 0 : avg);
                            data[i] = v;
                            data[i + 1] = v;
                            data[i + 2] = v;
                        }

                        ctx.putImageData(imgData, 0, 0);
                        resolve(canvas.toDataURL('image/jpeg', 0.85));
                    };
                    img.onerror = reject;
                    img.src = event.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function updateUI() {
            pageCountSpan.innerText = scannedPages.length;
            if (scannedPages.length > 0) {
                emptyState.classList.add('hidden');
                clearAllBtn.classList.remove('hidden');
                generatePdfBtn.removeAttribute('disabled');
            } else {
                emptyState.classList.remove('hidden');
                clearAllBtn.classList.add('hidden');
                generatePdfBtn.setAttribute('disabled', 'true');
            }

            thumbnailContainer.innerHTML = '';
            scannedPages.forEach((dataUrl, index) => {
                const card = document.createElement('div');
                card.className = "relative bg-slate-100 rounded-lg p-2 border border-slate-200 flex flex-col items-center shadow-sm";
                card.innerHTML = `
                    <span class="absolute top-3 left-3 bg-black/60 text-white text-[10px] px-1.5 py-0.5 rounded">Page ${index + 1}</span>
                    <img src="${dataUrl}" class="h-32 object-contain rounded mb-2 bg-white">
                    <button onclick="removePage(${index})" class="text-xs text-rose-600 font-medium hover:underline">Remove</button>
                `;
                thumbnailContainer.appendChild(card);
            });
        }

        window.removePage = function(index) {
            scannedPages.splice(index, 1);
            updateUI();
        }

        clearAllBtn.addEventListener('click', () => {
            if (confirm("Clear all scanned pages?")) {
                scannedPages = [];
                updateUI();
            }
        });

        generatePdfBtn.addEventListener('click', async () => {
            loadingText.innerText = "Compiling PDF document...";
            loadingOverlay.classList.remove('hidden');

            try {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    orientation: 'portrait',
                    unit: 'mm',
                    format: 'a4'
                });

                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();

                for (let i = 0; i < scannedPages.length; i++) {
                    if (i > 0) pdf.addPage();
                    
                    const img = new Image();
                    img.src = scannedPages[i];
                    await new Promise((resolve) => { img.onload = resolve; });

                    let imgWidth = pageWidth;
                    let imgHeight = (img.height * pageWidth) / img.width;

                    if (imgHeight > pageHeight) {
                        imgHeight = pageHeight;
                        imgWidth = (img.width * pageHeight) / img.height;
                    }

                    let x = (pageWidth - imgWidth) / 2;
                    let y = (pageHeight - imgHeight) / 2;

                    pdf.addImage(scannedPages[i], 'JPEG', x, y, imgWidth, imgHeight);
                }

                const timestamp = new Date().toISOString().slice(0,10).replace(/-/g,'');
                pdf.save(`ZenScan_${timestamp}.pdf`);
            } catch (err) {
                alert("Failed to generate PDF.");
                console.error(err);
            } finally {
                loadingOverlay.classList.add('hidden');
            }
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
            });
        }
    </script>
</body>
</html>
