<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenScan: Fast PDF Scanner</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ZenScan">
    <link rel="apple-touch-icon" href="icon-512.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jsPDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Google Mobile Ads / AdMob SDK Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js" crossorigin="anonymous"></script>

    <style>
        /* Animated laser scanning bar for live frame */
        @keyframes scanAnimation {
            0% { top: 5%; opacity: 0.8; }
            50% { top: 90%; opacity: 0.8; }
            100% { top: 5%; opacity: 0.8; }
        }
        .scan-laser {
            animation: scanAnimation 2.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- App Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex items-center justify-between">
        <div>
            <h1 class="text-xl font-bold tracking-wide">ZenScan 📄</h1>
            <p class="text-xs text-blue-100">100% Offline • High Quality PDF</p>
        </div>
        <a href="https://www.buymeacoffee.com/kromdev" target="_blank" rel="noopener noreferrer" class="bg-amber-400 hover:bg-amber-500 text-slate-900 text-xs font-bold py-2 px-3 rounded-lg shadow flex items-center gap-1 transition">
            <span>☕ Donate</span>
        </a>
    </header>

    <!-- Main App Container -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 flex flex-col gap-4">
        
        <!-- Mode Selector (Color / B&W / Grayscale) -->
        <div class="bg-white p-2 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
            <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider pl-2">Filter Mode:</span>
            <select id="filterMode" class="bg-slate-100 border border-slate-300 text-slate-700 text-xs font-medium rounded-lg p-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                <option value="color">🎨 Full Color (Default)</option>
                <option value="bw">📄 High Contrast B&W</option>
                <option value="grayscale">🩶 Grayscale</option>
            </select>
        </div>

        <!-- Action Buttons -->
        <div class="grid grid-cols-2 gap-3">
            <button id="openCameraBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl shadow text-center flex items-center justify-center gap-2 transition">
                <span>📷 Capture Page</span>
            </button>

            <button id="generatePdfBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-xl shadow flex items-center justify-center gap-2 transition disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                <span>💾 Save PDF (<span id="pageCount">0</span>)</span>
            </button>
        </div>

        <!-- Scanned Document Queue -->
        <div class="flex-1 bg-white border-2 border-dashed border-slate-200 rounded-2xl p-4 flex flex-col min-h-[250px]">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400">Scanned Queue</h2>
                <button id="clearAllBtn" class="text-xs text-rose-500 hover:underline hidden">Clear All</button>
            </div>

            <div id="emptyState" class="my-auto text-center text-slate-400 py-10">
                <p class="text-4xl mb-2">📥</p>
                <p class="text-sm">No pages captured yet.<br>Tap "Capture Page" to start scanning.</p>
            </div>

            <div id="thumbnailContainer" class="grid grid-cols-2 gap-3 overflow-y-auto max-h-[40vh] pr-1"></div>
        </div>
    </main>

    <!-- AdMob Banner Box -->
    <div class="w-full bg-slate-200 border-t border-slate-300 py-2 flex flex-col items-center justify-center min-h-[60px]">
        <p class="text-[10px] text-slate-400 uppercase tracking-widest mb-1">Advertisement</p>
        
        <ins class="adsbygoogle"
             style="display:block; width:100%; max-width:320px; height:50px;"
             data-ad-client="ca-app-pub-2603099615534110~5242761308"
             data-ad-slot="5242761308"
             data-ad-format="horizontal"
             data-full-width-responsive="false"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>

    <!-- Privacy Policy Footer -->
    <footer class="text-center py-2 bg-slate-100 border-t border-slate-200">
        <a href="privacy.html" class="text-[11px] text-slate-500 hover:underline">Privacy Policy</a>
    </footer>

    <!-- LIVE CAMERA MODAL WITH OVERLAY FRAME -->
    <div id="liveCameraModal" class="fixed inset-0 bg-black hidden flex-col items-center justify-between z-50">
        <!-- Live Camera Header -->
        <div class="w-full p-4 flex justify-between items-center bg-black/60 text-white z-10">
            <span class="text-xs font-semibold uppercase tracking-wider text-blue-400">Align document in frame</span>
            <button id="closeCameraBtn" class="text-white bg-slate-800 px-3 py-1 rounded-lg text-xs hover:bg-slate-700">Close</button>
        </div>

        <!-- Live Stream & Detection Frame Box -->
        <div class="relative w-full flex-1 flex items-center justify-center overflow-hidden">
            <video id="videoFeed" autoplay playsinline class="absolute inset-0 w-full h-full object-cover"></video>
            
            <!-- Real-Time Paper Frame Box -->
            <div class="relative w-[82%] h-[72%] border-2 border-emerald-400 rounded-lg shadow-[0_0_15px_rgba(52,211,153,0.5)] z-10 pointer-events-none flex flex-col justify-between p-2">
                <!-- Corner Indicators -->
                <div class="flex justify-between">
                    <div class="w-4 h-4 border-t-4 border-l-4 border-emerald-400"></div>
                    <div class="w-4 h-4 border-t-4 border-r-4 border-emerald-400"></div>
                </div>
                <!-- Animated Scan Laser -->
                <div class="scan-laser absolute left-0 right-0 h-0.5 bg-gradient-to-r from-transparent via-emerald-400 to-transparent shadow-[0_0_8px_#34d399]"></div>
                <div class="flex justify-between">
                    <div class="w-4 h-4 border-b-4 border-l-4 border-emerald-400"></div>
                    <div class="w-4 h-4 border-b-4 border-r-4 border-emerald-400"></div>
                </div>
            </div>
        </div>

        <!-- Camera Shutter Bar -->
        <div class="w-full p-6 bg-black/80 flex items-center justify-center z-10">
            <button id="shutterBtn" class="w-16 h-16 bg-white rounded-full border-4 border-blue-600 shadow-lg active:scale-95 transition flex items-center justify-center">
                <div class="w-12 h-12 bg-blue-600 rounded-full"></div>
            </button>
        </div>
    </div>

    <!-- CROP ADJUSTMENT MODAL -->
    <div id="cropModal" class="fixed inset-0 bg-black/90 hidden flex-col items-center justify-between p-4 z-50">
        <div class="text-white text-center py-2">
            <p class="font-bold text-sm">Review Page Crop</p>
            <p class="text-xs text-slate-300">Adjust borders if needed</p>
        </div>

        <div class="relative max-w-full max-h-[65vh] flex items-center justify-center overflow-hidden rounded-lg bg-black">
            <canvas id="cropCanvas" class="max-w-full max-h-[60vh] object-contain"></canvas>
        </div>

        <div class="flex gap-4 w-full max-w-xs my-2">
            <button id="cancelCropBtn" class="flex-1 bg-slate-600 hover:bg-slate-700 text-white font-medium py-2.5 rounded-xl text-xs">Retake</button>
            <button id="confirmCropBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-xl text-xs">Confirm & Add</button>
        </div>
    </div>

    <!-- Hidden Capture Canvas -->
    <canvas id="captureCanvas" class="hidden"></canvas>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex-col items-center justify-center text-white z-50">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-white border-t-transparent mb-3"></div>
        <p id="loadingText" class="font-medium text-sm">Processing image...</p>
    </div>

    <!-- App Engine Script -->
    <script>
        const openCameraBtn = document.getElementById('openCameraBtn');
        const liveCameraModal = document.getElementById('liveCameraModal');
        const videoFeed = document.getElementById('videoFeed');
        const closeCameraBtn = document.getElementById('closeCameraBtn');
        const shutterBtn = document.getElementById('shutterBtn');
        const captureCanvas = document.getElementById('captureCanvas');

        const thumbnailContainer = document.getElementById('thumbnailContainer');
        const emptyState = document.getElementById('emptyState');
        const generatePdfBtn = document.getElementById('generatePdfBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const pageCountSpan = document.getElementById('pageCount');
        const filterModeSelect = document.getElementById('filterMode');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');

        const cropModal = document.getElementById('cropModal');
        const cropCanvas = document.getElementById('cropCanvas');
        const cancelCropBtn = document.getElementById('cancelCropBtn');
        const confirmCropBtn = document.getElementById('confirmCropBtn');

        let videoStream = null;
        let scannedPages = [];
        let capturedImg = null;
        let cropRect = { x: 0.05, y: 0.05, w: 0.9, h: 0.9 };

        // Open live camera feed
        openCameraBtn.addEventListener('click', async () => {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } },
                    audio: false
                });
            } catch (err) {
                // Fallback to default user camera if environment camera fails
                try {
                    videoStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                } catch (e) {
                    alert("Unable to access camera permissions.");
                    return;
                }
            }
            videoFeed.srcObject = videoStream;
            liveCameraModal.classList.remove('hidden');
            liveCameraModal.classList.add('flex');
        });

        function stopCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
            liveCameraModal.classList.add('hidden');
            liveCameraModal.classList.remove('flex');
        }

        closeCameraBtn.addEventListener('click', stopCamera);

        // Snap photo from live camera feed
        shutterBtn.addEventListener('click', () => {
            const ctx = captureCanvas.getContext('2d');
            captureCanvas.width = videoFeed.videoWidth || 1280;
            captureCanvas.height = videoFeed.videoHeight || 720;
            ctx.drawImage(videoFeed, 0, 0, captureCanvas.width, captureCanvas.height);

            const dataUrl = captureCanvas.toDataURL('image/jpeg');
            capturedImg = new Image();
            capturedImg.onload = () => {
                stopCamera();
                openCropModal();
            };
            capturedImg.src = dataUrl;
        });

        function openCropModal() {
            cropModal.classList.remove('hidden');
            cropModal.classList.add('flex');
            cropRect = { x: 0.05, y: 0.05, w: 0.9, h: 0.9 };
            drawCropCanvas();
        }

        function drawCropCanvas() {
            if (!capturedImg) return;
            const ctx = cropCanvas.getContext('2d');
            cropCanvas.width = capturedImg.width;
            cropCanvas.height = capturedImg.height;

            ctx.drawImage(capturedImg, 0, 0);

            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            const rx = cropRect.x * cropCanvas.width;
            const ry = cropRect.y * cropCanvas.height;
            const rw = cropRect.w * cropCanvas.width;
            const rh = cropRect.h * cropCanvas.height;

            ctx.fillRect(0, 0, cropCanvas.width, ry);
            ctx.fillRect(0, ry, rx, rh);
            ctx.fillRect(rx + rw, ry, cropCanvas.width - (rx + rw), rh);
            ctx.fillRect(0, ry + rh, cropCanvas.width, cropCanvas.height - (ry + rh));

            ctx.strokeStyle = '#22c55e';
            ctx.lineWidth = Math.max(4, Math.round(cropCanvas.width / 150));
            ctx.strokeRect(rx, ry, rw, rh);
        }

        cancelCropBtn.addEventListener('click', () => {
            cropModal.classList.add('hidden');
            cropModal.classList.remove('flex');
            openCameraBtn.click(); // Re-open live camera
        });

        confirmCropBtn.addEventListener('click', () => {
            cropModal.classList.add('hidden');
            cropModal.classList.remove('flex');
            loadingText.innerText = "Applying selected filter...";
            loadingOverlay.classList.remove('hidden');

            setTimeout(() => {
                const processedDataUrl = processCroppedImage(capturedImg, cropRect, filterModeSelect.value);
                scannedPages.push(processedDataUrl);
                updateUI();
                loadingOverlay.classList.add('hidden');
            }, 100);
        });

        function processCroppedImage(img, crop, filter) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            const cropX = crop.x * img.width;
            const cropY = crop.y * img.height;
            const cropW = crop.w * img.width;
            const cropH = crop.h * img.height;

            const MAX_DIM = 1200;
            let width = cropW;
            let height = cropH;
            if (width > height && width > MAX_DIM) {
                height *= MAX_DIM / width;
                width = MAX_DIM;
            } else if (height > MAX_DIM) {
                width *= MAX_DIM / height;
                height = MAX_DIM;
            }

            canvas.width = width;
            canvas.height = height;

            ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, width, height);

            if (filter === 'bw' || filter === 'grayscale') {
                const imgData = ctx.getImageData(0, 0, width, height);
                const data = imgData.data;

                for (let i = 0; i < data.length; i += 4) {
                    let avg = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);

                    if (filter === 'bw') {
                        let threshold = 160;
                        let v = avg > threshold ? 255 : (avg < 60 ? 0 : avg);
                        data[i] = v;
                        data[i + 1] = v;
                        data[i + 2] = v;
                    } else if (filter === 'grayscale') {
                        data[i] = avg;
                        data[i + 1] = avg;
                        data[i + 2] = avg;
                    }
                }
                ctx.putImageData(imgData, 0, 0);
            }

            return canvas.toDataURL('image/jpeg', 0.85);
        }

        function updateUI() {
            pageCountSpan.innerText = scannedPages.length;
            if (scannedPages.length > 0) {
                emptyState.classList.add('hidden');
                clearAllBtn.classList.remove('hidden');
                generatePdfBtn.removeAttribute('disabled');
            } else {
                emptyState.classList.remove('hidden');
                clearAllBtn.classList.add('hidden');
                generatePdfBtn.setAttribute('disabled', 'true');
            }

            thumbnailContainer.innerHTML = '';
            scannedPages.forEach((dataUrl, index) => {
                const card = document.createElement('div');
                card.className = "relative bg-slate-100 rounded-lg p-2 border border-slate-200 flex flex-col items-center shadow-sm";
                card.innerHTML = `
                    <span class="absolute top-3 left-3 bg-black/60 text-white text-[10px] px-1.5 py-0.5 rounded">Page ${index + 1}</span>
                    <img src="${dataUrl}" class="h-32 object-contain rounded mb-2 bg-white">
                    <button onclick="removePage(${index})" class="text-xs text-rose-600 font-medium hover:underline">Remove</button>
                `;
                thumbnailContainer.appendChild(card);
            });
        }

        window.removePage = function(index) {
            scannedPages.splice(index, 1);
            updateUI();
        }

        clearAllBtn.addEventListener('click', () => {
            if (confirm("Clear all scanned pages?")) {
                scannedPages = [];
                updateUI();
            }
        });

        generatePdfBtn.addEventListener('click', async () => {
            loadingText.innerText = "Compiling PDF document...";
            loadingOverlay.classList.remove('hidden');

            try {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    orientation: 'portrait',
                    unit: 'mm',
                    format: 'a4'
                });

                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();

                for (let i = 0; i < scannedPages.length; i++) {
                    if (i > 0) pdf.addPage();
                    
                    const img = new Image();
                    img.src = scannedPages[i];
                    await new Promise((resolve) => { img.onload = resolve; });

                    let imgWidth = pageWidth;
                    let imgHeight = (img.height * pageWidth) / img.width;

                    if (imgHeight > pageHeight) {
                        imgHeight = pageHeight;
                        imgWidth = (img.width * pageHeight) / img.height;
                    }

                    let x = (pageWidth - imgWidth) / 2;
                    let y = (pageHeight - imgHeight) / 2;

                    pdf.addImage(scannedPages[i], 'JPEG', x, y, imgWidth, imgHeight);
                }

                const timestamp = new Date().toISOString().slice(0,10).replace(/-/g,'');
                pdf.save(`ZenScan_${timestamp}.pdf`);
            } catch (err) {
                alert("Failed to generate PDF.");
                console.error(err);
            } finally {
                loadingOverlay.classList.add('hidden');
            }
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
            });
        }
    </script>
</body>
</html>
